<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/tonverifier.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TON Верификатор - Инструмент для верификации ваших контрактов в блокчейне TON"
    />

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="TON Верификатор" />
    <meta
      itemprop="description"
      content="TON Верификатор - Инструмент для верификации ваших контрактов в блокчейне TON"
    />
    <meta itemprop="image" content="./src/assets/tonverifier.png" />

    <!-- Facebook Meta Tags -->
    <meta property="og:url" content="https://tonverifier.live" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TON Верификатор" />
    <meta
      property="og:description"
      content="TON Верификатор - Инструмент для верификации ваших контрактов в блокчейне TON"
    />
    <meta property="og:image" content="./src/assets/tonverifier.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TON Верификатор" />
    <meta
      name="twitter:description"
      content="TON Верификатор - Инструмент для верификации ваших контрактов в блокчейне TON"
    />
    <title>TON Верификатор</title>
    <script type="module">
      if (import.meta.env.VITE_REDIRECT && window.location.hostname === "tonverifier.live") {
        window.location.replace(
          window.location.href.replace("tonverifier.live", "verifier.ton.org"),
        );
      }
    </script>
    <script type="module" src="/src/polyfills.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
